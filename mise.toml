[tools]
node = "24.18.0"
aube = "1.29.1"
jj = "0.43.0"
jjui = "0.10.8"
"github:flupkede/codesearch" = "1.1.30"
"github:Muvon/octocode" = "0.14.0"

[tasks.install]
description = "Install Atelier development dependencies"
run = "aube install --frozen-lockfile && aubr setup:octocode"

[tasks.atlr]
description = "Run the Atelier CLI"
run = "aubr atlr --"

[tasks.doctor]
description = "Run Atelier diagnostics"
run = "aubr doctor"

[tasks.test]
description = "Run the test suite"
run = "aubr test"

[tasks."test:coverage"]
description = "Run tests with coverage"
run = "aubr test:coverage"

[tasks.check]
description = "Run all repository checks"
run = "aubr check"

[tasks."test:codesearch"]
description = "Alias for the explicit live codesearch test"
run = "aubr test:codesearch:live"

[tasks."test:codesearch:live"]
description = "Probe a real codesearch installation and capture conformance data"
run = "aubr test:codesearch:live"

[tasks."evaluate:code"]
description = "Run the code-intelligence evaluation task set"
run = "aubr evaluate:code"

[tasks."fixtures:codesearch"]
description = "Normalize a real codesearch probe into portable fixtures"
run = "aubr fixtures:codesearch"

[tasks."collect:codesearch"]
description = "Collect all remaining real-provider knowledge on this machine"
run = "aubr collect:codesearch"

[tasks."test:octocode:live"]
description = "Probe a real Octocode installation and capture conformance data"
run = "aubr test:octocode:live"

[tasks."collect:octocode"]
description = "Collect Octocode provider knowledge on this machine"
run = "aubr collect:octocode"

[tasks."evaluate:code:octocode"]
description = "Run the code-intelligence evaluation with Octocode"
run = "aubr evaluate:code:octocode"

[tasks."evaluate:code:all"]
description = "Compare baseline, codesearch, and Octocode"
run = "aubr evaluate:code:all"
